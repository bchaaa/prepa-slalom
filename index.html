<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prépa Slalom">
<meta name="theme-color" content="#EEF3F7">
<title>Prépa Slalom</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>Prépa Slalom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout : appli mobile à onglets, une colonne, barre d'onglets fixe en bas. Piquets rouges/bleus = codage jambe droite / gauche et types de séance. */
:root{
  --bg:#EEF3F7; --surface:#FFFFFF; --ink:#0F2131; --muted:#5A6B7B; --line:#D6E0E8; --chip:#E3EBF2;
  --red:#D2253A; --blue:#1D5AD3; --teal:#0C8676; --amber:#B9730A; --prop:#C6D4E0;
  --fig:#0F2131; --fig2:#8C9FB0; --hair:#7A4A26; --snow:#E2EAF1; --violet:#6A47D6;
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09131C; --surface:#121F2B; --ink:#E5EDF4; --muted:#93A5B5; --line:#223442; --chip:#1A2A38;
  --red:#FF5B6C; --blue:#6F9DFF; --teal:#3CC4AF; --amber:#F0A83A; --prop:#2B3D4D;
  --fig:#E5EDF4; --fig2:#647B8E; --hair:#C98F5E; --snow:#0F1C27; --violet:#A895FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09131C; --surface:#121F2B; --ink:#E5EDF4; --muted:#93A5B5; --line:#223442; --chip:#1A2A38;
  --red:#FF5B6C; --blue:#6F9DFF; --teal:#3CC4AF; --amber:#F0A83A; --prop:#2B3D4D;
  --fig:#E5EDF4; --fig2:#647B8E; --hair:#C98F5E; --snow:#0F1C27; --violet:#A895FF; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 110px}
h1,h2,h3{font-family:var(--f-disp);margin:0;letter-spacing:.01em;text-wrap:balance;line-height:1.05}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.muted{color:var(--muted)}
.tab{display:flex;flex-direction:column;gap:16px}

/* Hero compte à rebours */
.hero{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end}
.jx{font-family:var(--f-disp);font-weight:800;font-size:76px;line-height:.8;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.jx span{color:var(--red)}
.hero-t{padding-bottom:4px;min-width:0}
.hero-t b{display:block;font-family:var(--f-disp);font-size:22px;font-weight:700;line-height:1.05}
.track{grid-column:1/-1;position:relative;height:22px;margin-top:10px}
.track .bar{position:absolute;left:0;right:0;top:10px;height:2px;background:var(--line)}
.track .fill{position:absolute;left:0;top:10px;height:2px;background:var(--ink)}
.track .gate{position:absolute;top:2px;width:3px;height:18px;border-radius:2px}
.track .me{position:absolute;top:5px;width:12px;height:12px;border-radius:50%;background:var(--ink);transform:translateX(-6px);box-shadow:0 0 0 3px var(--bg)}
.phase{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}

/* Semaine */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:12px;font-variant-numeric:tabular-nums}
.day .dw{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day .dn{font-family:var(--f-disp);font-size:20px;font-weight:700;line-height:1}
.day.sel{background:var(--surface);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.day.tdy .dn{color:var(--red)}
.mk{width:14px;height:14px;display:block}

.note{background:var(--chip);border-radius:var(--r);padding:12px 14px;font-size:14px}
.note b{font-weight:700}
.viewing{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;background:var(--chip);border-radius:var(--r);padding:10px 14px}
.link{color:var(--blue);font-weight:600}

/* Carte séance */
.card{background:var(--surface);border-radius:18px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.card-h{padding:16px 16px 12px;display:flex;flex-direction:column;gap:6px}
.card-h h2{font-size:30px;font-weight:800}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:3px 9px 3px 7px;border-radius:99px;background:var(--chip);color:var(--ink)}
.tag i{width:8px;height:8px;border-radius:2px;display:block}
.prog{height:4px;background:var(--chip)}
.prog div{height:100%;background:var(--teal);transition:width .3s}
.items{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:44px 1fr;align-items:center;border-top:1px solid var(--line)}
.chk{width:44px;height:100%;min-height:64px;display:grid;place-items:center}
.chk span{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:.15s}
.it.ok .chk span{background:var(--teal);border-color:var(--teal);animation:pop .25s}
@keyframes pop{50%{transform:scale(1.25)}}
.it.ok .chk span::after{content:"";width:9px;height:5px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.exb{display:grid;grid-template-columns:54px 1fr 18px;gap:12px;align-items:center;padding:8px 14px 8px 0;text-align:left;min-width:0}
.th{width:54px;height:60px;border-radius:10px;background:var(--bg);overflow:hidden}
.th svg{width:100%;height:100%}
.exb b{display:block;font-weight:600;line-height:1.2}
.exb small{display:block;color:var(--muted);font-size:13.5px;line-height:1.3;margin-top:2px}
.it.ok .exb b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.chev{width:8px;height:8px;border:solid var(--muted);border-width:2px 2px 0 0;transform:rotate(45deg)}
.uni{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--red);margin-left:6px;vertical-align:2px}
.sess-note{padding:12px 16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.finish{padding:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.rpe-row{display:flex;justify-content:space-between;align-items:baseline}
.rpe-v{font-family:var(--f-disp);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--red)}
textarea,input[type=number]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:70px;resize:vertical}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.sm{min-height:38px;font-size:14px;padding:0 12px}
.done-b{display:flex;gap:12px;align-items:center;padding:16px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--teal) 12%,var(--surface))}
.done-b .big{width:40px;height:40px;border-radius:50%;background:var(--teal);display:grid;place-items:center;flex:none}
.done-b .big::after{content:"";width:14px;height:8px;border:solid #fff;border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-2px)}
.done-b div{flex:1;min-width:0;font-size:14px}
.rest{padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.rest ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px}

/* Tests */
.test{display:grid;grid-template-columns:1fr 110px;gap:8px 12px;padding:14px 16px;border-top:1px solid var(--line);align-items:center}
.test p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.test .u{font-size:12px;color:var(--muted);text-align:right;margin-top:2px}

/* Programme */
.phase-h{display:flex;flex-direction:column;gap:4px;padding-top:6px}
.phase-h h2{font-size:28px;font-weight:800}
.phase-h .pn{font-family:var(--f-disp);font-weight:700;font-size:15px;color:var(--red);letter-spacing:.06em;text-transform:uppercase}
.wk{background:var(--surface);border-radius:var(--r);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.wk-h{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 4px;gap:8px}
.wk-h b{font-family:var(--f-disp);font-size:19px;font-weight:700}
.wk-h span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk p{margin:0;padding:0 14px 10px;font-size:13.5px;color:var(--muted)}
.row{display:grid;grid-template-columns:62px 14px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.row .d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .n{font-weight:600;min-width:0}
.row.past:not(.dn) .n{color:var(--muted)}
.row.today{background:color-mix(in srgb,var(--red) 7%,var(--surface))}
.st{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.st.ok{color:var(--teal)}
.st.miss{color:var(--muted)}

/* Progrès */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border-radius:var(--r);box-shadow:0 0 0 1px var(--line);padding:12px}
.kpi b{display:block;font-family:var(--f-disp);font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted);line-height:1.2;display:block;margin-top:4px}
.panel-c{background:var(--surface);border-radius:var(--r);box-shadow:0 0 0 1px var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel-c h3{font-size:22px;font-weight:700}
.gates{display:flex;flex-direction:column;gap:6px}
.gl{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.gl .wn{font-family:var(--f-disp);font-weight:700;color:var(--muted)}
.gl .gs{display:flex;gap:7px}
.gl small{font-size:12.5px;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.up{color:var(--teal);font-weight:700}
.down{color:var(--red);font-weight:700}
.asym{display:flex;gap:14px;align-items:center}
.asym .big{font-family:var(--f-disp);font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.legs{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legs i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* Bibliothèque */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:99px;background:var(--chip);font-size:14px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gc{background:var(--surface);border-radius:var(--r);box-shadow:0 0 0 1px var(--line);padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.gc .th{width:100%;height:120px}
.gc b{font-weight:600;line-height:1.2}
.gc small{color:var(--muted);font-size:12.5px}

/* Barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted)}
.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--ink)}
.tabs button.on svg{stroke:var(--red)}

/* Fiche exercice */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(5,12,18,.5);animation:fade .2s}
.pnl{position:relative;width:100%;max-width:560px;max-height:94%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:rise .28s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.x{position:absolute;right:14px;top:14px;z-index:2;width:36px;height:36px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:20px;line-height:1}
.stage{position:relative;background:var(--bg);border-radius:16px;margin-top:8px;overflow:hidden}
.stage svg{width:100%;max-width:320px;height:auto;display:block;margin:0 auto}
.stage .rep{position:absolute;left:12px;top:10px;font-family:var(--f-disp);font-weight:700;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage .rep b{color:var(--ink);font-size:20px}
.stage .lg{position:absolute;left:12px;top:36px;display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
.stage .lg i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.sbar{display:flex;align-items:center;gap:10px;padding:10px 12px 12px;border-top:1px solid var(--line)}
.cap{flex:1;min-width:0;font-family:var(--f-disp);font-weight:700;font-size:19px;line-height:1.1}
.cap.in{animation:capin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes capin{from{opacity:0;transform:translateY(6px)}}
.ctl{display:flex;gap:6px;flex:none}
.ctl button{font-size:12.5px;font-weight:700;background:var(--surface);border-radius:99px;padding:6px 11px;box-shadow:0 0 0 1px var(--line)}
.ctl button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.cyc{height:3px;background:var(--line)}
.cyc i{display:block;height:100%;width:0;background:var(--red)}
.pnl h2{font-size:32px;font-weight:800;margin-top:14px}
.rx{margin-top:8px;font-family:var(--f-disp);font-size:21px;font-weight:700;background:var(--chip);border-radius:10px;padding:8px 12px}
.sec{margin-top:16px}
.sec h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.sec p{margin:0}
.cues{margin:0;padding:0;list-style:none;counter-reset:c;display:flex;flex-direction:column;gap:6px}
.cues li{counter-increment:c;display:grid;grid-template-columns:24px 1fr;gap:8px}
.cues li::before{content:counter(c);font-family:var(--f-disp);font-weight:800;color:var(--red);font-size:18px;line-height:1.3}
.var{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.var div{background:var(--bg);border-radius:10px;padding:10px;font-size:14px}
.var b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.timer{display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:14px;padding:12px}
.timer .tv{font-family:var(--f-disp);font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;text-align:center}
.timer .tv.go{color:var(--red)}
.tbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

/* Séance guidée */
.cta{display:flex;flex-direction:column;gap:6px;padding:0 16px 16px}
.cta small{color:var(--muted);font-size:13px;text-align:center}
.btn.go{background:var(--red);color:#fff;min-height:56px;font-size:17px;border-radius:14px;box-shadow:0 6px 18px -8px var(--red)}
.btn.go svg{width:18px;height:18px;fill:currentColor}
.chrono-b{display:inline-block;margin-left:8px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--red);vertical-align:1px}
.player{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px calc(env(safe-area-inset-bottom,0px) + 12px);--ph:var(--amber);overflow:hidden}
.player[data-ph="work"]{--ph:var(--red)}.player[data-ph="rest"]{--ph:var(--teal)}.player[data-ph="done"]{--ph:var(--teal)}
.glow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s}
.glow.g-prep{background:radial-gradient(130% 55% at 50% 0%,color-mix(in srgb,var(--amber) 26%,transparent),transparent 70%)}
.glow.g-work{background:radial-gradient(130% 55% at 50% 0%,color-mix(in srgb,var(--red) 26%,transparent),transparent 70%)}
.glow.g-rest{background:radial-gradient(130% 55% at 50% 0%,color-mix(in srgb,var(--teal) 26%,transparent),transparent 70%)}
.player[data-ph="prep"] .g-prep,.player[data-ph="work"] .g-work,.player[data-ph="rest"] .g-rest,.player[data-ph="done"] .g-rest{opacity:1}
.player>*{position:relative}
.pl-top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px}
.pl-ic{width:40px;height:40px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:22px;line-height:1}
.pl-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pl-ic[aria-pressed="false"]{opacity:.45}
.pl-title{text-align:center;font-family:var(--f-disp);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-bar{height:5px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
.pl-bar i{display:block;height:100%;width:0;background:var(--ph);transition:background-color .4s}
.pl-time{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.pl-body{flex:1;min-height:0;display:flex;flex-direction:column}
.pl-run{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.pl-head{display:flex;align-items:center;gap:10px;margin-top:6px}
.pl-chip{font-family:var(--f-disp);font-weight:800;font-size:18px;letter-spacing:.06em;padding:3px 12px;border-radius:8px;background:var(--ph);color:#fff;transition:background-color .4s}
.pl-sub{font-size:14px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.pl-stage{flex:1;min-height:150px;position:relative;display:flex;justify-content:center;align-items:flex-end}
.pl-stage svg{height:100%;width:auto;max-width:100%;transition:opacity .4s}
.pl-stage.next svg{opacity:.5}

<script>
"use strict";
/* ============ Moteur d'animation : bonhomme en cinématique directe ============
   Pose = angles en degrés (0 = vers le bas, + = vers la droite de l'écran).
   v:"s" vue de profil (regarde à droite), v:"f" vue de face.
   kl/kr (vue de face) : flexion du genou vers la caméra, raccourcit visuellement la jambe.
   Image clé = [pose, durée transition ms, maintien ms, consigne, easing]. Durée 0 = coupe en fondu. */
const G=186, RAD=Math.PI/180, LEN={T:46,H:15,L1:40,L2:40,A1:26,A2:24,F:11};
const DEF={v:"s",t:4,hd:null,l:[2,2],r:[-2,-2],la:[8,14],ra:[-6,-2],fl:90,fr:90,px:0,lift:0,kl:0,kr:0};
const P=o=>Object.assign({},DEF,o);
const EZ={io:u=>.5-.5*Math.cos(Math.PI*u),out:u=>Math.sin(Math.PI*u/2),in:u=>1-Math.cos(Math.PI*u/2),lin:u=>u};

  const seg=(o,a,l)=>[o[0]+S(a*RAD)*l,o[1]+C(a*RAD)*l];
  const lh=[-pr[0]*hw,-pr[1]*hw],rh=[pr[0]*hw,pr[1]*hw];

  const tl=f?1-.55*S(p.kl*RAD):1,sl=f?1-.12*S(p.kl*RAD):1,tr=f?1-.55*S(p.kr*RAD):1,sr=f?1-.12*S(p.kr*RAD):1;

function lowest(o){let m=Math.max(o.head[1]+9,o.pel[1]+4);for(const k of["lk","rk","lan","ran","lt","rt","le","re","lw","rw"])if(o[k])m=Math.max(m,o[k][1]);return m}

  else{ox=100+p.px;oy=G-lowest(rel)-p.lift;}

}
function propSVG(ex,pr){
  if(pr.k==="line")return `<rect x="${pr.x-2}" y="${G-1}" width="4" height="8" rx="1" fill="var(--red)"/>`;
  if(pr.k==="rect")return `<rect class="prop" x="${pr.x}" y="${G-pr.h}" width="${pr.w}" height="${pr.h+3}" rx="${pr.rx||3}"/>`;
  const pt=place(ex,ex.anim.fr[pr.f||0][0])[pr.at];
  if(pr.k==="box"){const w=pr.w||40,top=pt[1]+(pr.gap==null?3:pr.gap),x=pt[0]+(pr.dx||0)-w/2;return `<rect class="prop" x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w}" height="${(G+3-top).toFixed(1)}" rx="3"/>`}
  if(pr.k==="wall"){const x=pt[0]+(pr.dx||0);return `<rect class="prop" x="${x.toFixed(1)}" y="${G-150}" width="7" height="153" rx="2"/>`}

function prep(ex){

/* Queue de cheval : point d'attache derrière la tête (vue de profil, tête à peu près droite) */
function hairBase(s,p){

const n1=v=>v.toFixed(1);
function figBody(s,p,tail){
  const f=p.v==="f",pl=(...ks)=>ks.filter(k=>s[k]).map(k=>n1(s[k][0])+","+n1(s[k][1])).join(" ");

  if(f){const mp=[(s.lh[0]+s.rh[0])/2,(s.lh[1]+s.rh[1])/2],ms=[(s.ls[0]+s.rs[0])/2,(s.ls[1]+s.rs[1])/2];

    h+=`<polyline class="leg lft" points="${n1(s.lan[0]-6)},${n1(s.lan[1]+1)} ${n1(s.lan[0]+1)},${n1(s.lan[1]+1)}"/><polyline class="leg rgt" points="${n1(s.ran[0]-1)},${n1(s.ran[1]+1)} ${n1(s.ran[0]+6)},${n1(s.ran[1]+1)}"/>`;}

  h+=`<polyline class="leg rgt" points="${pl("rh","rk","ran","rt")}"/>`;
  h+=`<polyline class="arm" points="${pl("rs","re","rw")}"/><circle class="hand" cx="${n1(s.rw[0])}" cy="${n1(s.rw[1])}" r="3"/>`;
  h+=`<circle class="head" cx="${n1(s.head[0])}" cy="${n1(s.head[1])}" r="9"/>`;
  return h;
}
function figInner(ex,p,o){
  prep(ex);o=o||{};const s=o.s||place(ex,p),sh=Math.max(10,26-p.lift*.25);
  let h=`<rect class="snow" x="-20" y="${G+3}" width="240" height="40"/><line class="gnd" x1="-20" y1="${G+3}" x2="220" y2="${G+3}"/><ellipse cx="${n1(s.pel[0])}" cy="${G+3}" rx="${n1(sh)}" ry="3" class="shd"/>`+ex._props;
  if(o.ghosts)o.ghosts.forEach((g,i)=>{h+=`<g opacity="${i?0.08:0.16}">${figBody(place(ex,g),g)}</g>`});
  return h+`<g opacity="${o.a==null?1:o.a.toFixed(2)}">${figBody(s,p,o.tail)}</g>`;

const VB=`viewBox="0 -30 200 222"`;
function figSVG(ex,p){return `<svg viewBox="8 -6 184 198" class="fig" aria-hidden="true">${figInner(ex,p)}</svg>`}
function thumb(id){const ex=EX[id],fr=ex.anim.fr,i=ex.anim.th!=null?ex.anim.th:(fr.length>1?1:0);return figSVG(ex,fr[i][0])}
function lerpP(a,b,u){
  const o={v:a.v};for(const k of["t","fl","fr","px","lift","kl","kr"])o[k]=a[k]+(b[k]-a[k])*u;
  const ah=a.hd==null?a.t:a.hd,bh=b.hd==null?b.t:b.hd;o.hd=ah+(bh-ah)*u;
  for(const k of["l","r","la","ra"])o[k]=[a[k][0]+(b[k][0]-a[k][0])*u,a[k][1]+(b[k][1]-a[k][1])*u];
  return o;
}
/* Échantillonne l'animation : pose, index de l'image clé (pour la consigne), opacité (fondu des coupes) */
function sample(ex,ms){
  prep(ex);const fr=ex.anim.fr,n=fr.length,FD=180;let t=((ms%ex._tot)+ex._tot)%ex._tot;

  return{p:fr[0][0],i:0,a:1};
}

/* ============ Poses partagées ============ */
const SQ=P({t:40,l:[82,-25],r:[86,-27],la:[80,85],ra:[76,80]});
const fS=o=>P(Object.assign({v:"f",t:0},o));
const shuffleFr=(()=>{const W=x=>fS({kl:50,kr:50,l:[-32,2],r:[32,-2],la:[-35,40],ra:[35,-40],px:x}),N=x=>fS({kl:45,kr:45,l:[-20,10],r:[20,-10],la:[-35,40],ra:[35,-40],px:x,lift:5});
  return [W(-36),N(-24),W(-12),N(0),W(12),N(24),W(36),N(24),W(12),N(0),W(-12),N(-24)].map((p,i)=>[p,150,i%6===0?200:15,i<6?"Pas chassés vers la droite, reste basse":"Puis vers la gauche, sans croiser"]);})();
const lineS=x=>fS({kl:45,kr:45,l:[-17,9],r:[17,-9],la:[-30,25],ra:[30,-25],px:x}), lineA=fS({kl:55,kr:55,l:[-20,12],r:[20,-12],la:[-30,25],ra:[30,-25],lift:14});

  let gates="";Object.keys(PLAN).forEach(k=>{const x=diff(START,D(k))/tot;if(x<0)return;const c=TYPES[SES[PLAN[k]].type][1];gates+=`<i class="gate" style="left:${(x*100).toFixed(2)}%;background:${c};opacity:${st.done[k]?1:.35}"></i>`});
  const big=left>0?`J<span>-</span>${left}`:left===0?"Jour J":"Go";
  const sub=left>0?"avant le début de saison":left===0?"La saison commence aujourd’hui":"La saison est lancée";
  return `<div class="hero"><div class="jx">${big}</div><div class="hero-t"><div class="eyebrow">Prépa slalom · monitrice</div><b>${sub}</b><span class="muted" style="font-size:14px">${fmt(SEASON)}</span></div>

}

}

}

}
function plStart(){
  audio();tone(1,.01,0,.0001);voice(["go"],"C’est parti");
  PL.on=true;PL.i=0;PL.el=0;PL.last=performance.now();runView();enterStep(true);wake(true);
  cancelAnimationFrame(PL.raf);PL.raf=requestAnimationFrame(plLoop);
}
function nextWorkAfter(i){for(let j=i+1;j<PL.steps.length;j++)if(PL.steps[j].kind==="work")return PL.steps[j];return null}
const sideTxt=x=>x.side?(x.sub&&/côté/.test(x.sub)?(x.side==="G"?" · côté gauche":" · côté droit"):(x.side==="G"?" · jambe gauche":" · jambe droite")):"";
function enterStep(fx){
  const st_=PL.steps[PL.i];if(!st_)return;const ex=exSide(st_.ex,st_.side),pl=$("#player");
  pl.dataset.ph=st_.kind;PL.sim=0;PL.capI=-1;PL.tail=null;PL.lastSec=-1;PL.lastRep=-1;
  $("#pl-chip").textContent=st_.kind==="work"?(st_.warm?"ÉCHAUFFEMENT":st_.test?"TEST":"GO"):st_.kind==="prep"?"PRÊTE ?":st_.label.toUpperCase();
  const nw=nextWorkAfter(PL.i);
  $("#pl-sub").textContent=st_.kind==="work"?(st_.sub||""):st_.kind==="rest"?`${mmss(st_.dur)} de récup`:`Départ dans ${st_.dur} s`;
  const nm=$("#pl-name");nm.textContent=ex.n;nm.classList.remove("in");void nm.offsetWidth;nm.classList.add("in");
  $("#pl-tip").textContent=st_.kind==="work"?(st_.tip||(st_.reps?"Suis le rythme du bonhomme":"")):`Ensuite : ${st_.sub||PL.steps[PL.i+1]&&PL.steps[PL.i+1].sub||"mets-toi en place"}`;
  $("#pl-stage").classList.toggle("next",st_.kind!=="work");
  $("#pl-num").classList.toggle("long",!!st_.open||(!st_.reps&&st_.dur>=60));
  $("#pl-done").hidden=!st_.open;
  $("#pl-after").innerHTML=st_.kind==="work"?(nw?`<span class="th">${thumb(nw.ex)}</span><span>Ensuite : <b>${esc(EX[nw.ex].n)}</b>${esc(sideTxt(nw))}</span>`:`<span>Dernier effort, à fond !</span>`):"";
  if(!fx)return;
  if(st_.kind==="work"){SND.go();if(!st_.warm){const f=$("#pl-flash");f.textContent="GO";f.classList.remove("on");void f.offsetWidth;f.classList.add("on")}else voice(["n_"+st_.ex],ex.n);}
  else if(st_.kind==="rest"){SND.rest();const pv=PL.steps[PL.i-1];
    if(/^Change/.test(st_.label))voice([LABK[st_.label]],st_.label);
    else if(st_.dur>=15||!pv||pv.ex!==st_.ex)voice([LABK[st_.label],"nx_"+st_.ex,st_.side==="G"?"jambe_g":null].filter(Boolean),`${/^(Repos|Enchaîne)$/.test(st_.label)?"":st_.label+". "}Ensuite : ${ex.n}${st_.side==="G"?", jambe gauche":""}`);}
  else voice(["prep","n_"+st_.ex],`Prépare-toi. ${ex.n}`);
}
function plAdvance(){PL.el=0;PL.i++;if(PL.i>=PL.steps.length){plDone();return}enterStep(true)}
function plLoop(now){
  const dt=Math.min(100,now-PL.last);PL.last=now;
  if(!PL.paused){PL.el+=dt/1000;PL.sim+=dt*(PL.steps[PL.i].kind==="work"?1:.6);}
  let moved=0;
  while(PL.i<PL.steps.length&&PL.el>=PL.steps[PL.i].dur){PL.el-=PL.steps[PL.i].dur;PL.i++;moved++;}
  if(PL.i>=PL.steps.length){plDone();return}
  if(moved)enterStep(moved===1);
  const s_=PL.steps[PL.i],ex=exSide(s_.ex,s_.side),n=$("#pl-num"),sm=$("#pl-small"),sec=Math.ceil(s_.dur-PL.el);
  if(s_.open){const e=Math.floor(PL.el);if(e!==PL.lastSec){PL.lastSec=e;n.textContent=mmss(e);sm.textContent="chrono"}
    $("#pl-arc").setAttribute("stroke-dashoffset",(452.4*(1-(PL.el%60)/60)).toFixed(1));}
  else if(s_.reps){const done=Math.min(s_.reps,Math.floor(PL.sim/s_.cyc)*s_.per),e=Math.floor(PL.el);
    if(done!==PL.lastRep){PL.lastRep=done;n.textContent=done;if(done>0&&!PL.paused){SND.rep();n.classList.remove("tick");void n.offsetWidth;n.classList.add("tick")}}
    if(e!==PL.lastSec){PL.lastSec=e;sm.textContent=`sur ${s_.reps}${s_.perSide?" /jambe":""} · ${mmss(e)}`}
    $("#pl-arc").setAttribute("stroke-dashoffset",(452.4*(PL.el/s_.dur)).toFixed(1));}
  else{if(sec!==PL.lastSec){PL.lastSec=sec;n.textContent=s_.dur>=60?mmss(sec):sec;sm.textContent=s_.dur>=60?"restant":"secondes";
      if(sec<=3&&sec>=1&&!PL.paused&&PL.el>.05){SND.tick();n.classList.remove("tick");void n.offsetWidth;n.classList.add("tick")}
      if(sec===10&&s_.kind==="rest"&&s_.dur>=30&&!PL.paused)voice(["dix"],"Dix secondes");
      if(s_.kind==="work"&&s_.dur>=40&&sec===Math.round(s_.dur/2)&&!PL.paused)voice(["moitie"],"Moitié");}
    $("#pl-arc").setAttribute("stroke-dashoffset",(452.4*(PL.el/s_.dur)).toFixed(1));}
  const g=PL.starts[PL.i]+(s_.open?Math.min(PL.el,s_.est):PL.el);$("#pl-fill").style.width=Math.min(100,g/PL.tot*100).toFixed(2)+"%";$("#pl-el").textContent=mmss(g);
  const smp=sample(ex,PL.sim),pts=place(ex,smp.p),hb=hairBase(pts,smp.p);
  if(hb){const tg=[hb[0]-5,hb[1]+12];if(!PL.tail||smp.a<.05)PL.tail=tg;else{PL.tail[0]+=(tg[0]-PL.tail[0])*.22;PL.tail[1]+=(tg[1]-PL.tail[1])*.22}
    const dx=PL.tail[0]-hb[0],dy=PL.tail[1]-hb[1],dd=Math.hypot(dx,dy);if(dd>15)PL.tail=[hb[0]+dx/dd*15,hb[1]+dy/dd*15]}else PL.tail=null;
  const gh=s_.kind==="work"&&FAST.has(ex.cat)&&!PL.paused?[sample(ex,PL.sim-55).p,sample(ex,PL.sim-110).p]:null;
  $("#pl-fig").innerHTML=figInner(ex,smp.p,{s:pts,a:smp.a,tail:PL.tail,ghosts:gh});
  if(smp.i!==PL.capI){PL.capI=smp.i;$("#pl-cap").textContent=s_.kind==="work"?(ex.anim.fr[smp.i][3]||""):""}
  PL.raf=requestAnimationFrame(plLoop);
}
function plFinishOpen(){if(!PL.on)return;const s_=PL.steps[PL.i];if(s_&&s_.test==="wall")PL.rec.wall=Math.round(PL.el);plAdvance()}
function plPause(p){PL.paused=p;const b=$("#pl-pp");if(!b)return;b.innerHTML=p?ICON.play:ICON.pause;b.setAttribute("aria-label",p?"Reprendre":"Pause");
  let pz=$("#pl-pz");if(p&&!pz){$("#pl-stage").insertAdjacentHTML("beforeend",'<div class="pl-paused" id="pl-pz">En pause</div>')}else if(!p&&pz)pz.remove();
  if(p)vxStop()}
function plJump(d){if(!PL.on)return;if(d<0&&PL.el>2){PL.el=0;enterStep(false);return}
  if(d>0){const s_=PL.steps[PL.i];if(s_&&s_.open){plFinishOpen();return}if(PL.i>=PL.steps.length-1){plDone();return}}
  PL.i=Math.max(0,Math.min(PL.steps.length-1,PL.i+d));PL.el=0;enterStep(true);}
function plClose(){cancelAnimationFrame(PL.raf);PL.on=false;wake(false);vxStop();$("#player").hidden=true;document.body.style.overflow="";render()}
function testInputs(k,ids){const v=st.tests[k]||{};return ids.map(id=>{const t=TESTS.find(x=>x.id===id);return `<label class="tin"><span>${esc(t.n)}</span><input type="number" inputmode="decimal" data-test="${id}" data-k="${k}" value="${v[id]!=null?esc(v[id]):""}" placeholder="—"><small>${t.u}</small></label>`}).join("")}
function plDone(){
  cancelAnimationFrame(PL.raf);PL.on=false;wake(false);SND.end();
  const M=PL.meta,k=M.k;$("#player").dataset.ph="done";$("#pl-fill").style.width="100%";$("#pl-el").textContent=mmss(PL.tot);
  if(k&&PL.rec.wall!=null){(st.tests[k]||(st.tests[k]={})).wall=PL.rec.wall}
  const cols=["var(--red)","var(--blue)"];let conf="";for(let i=0;i<18;i++){const a=i/18*Math.PI*2,r=90+Math.random()*60;conf+=`<i class="conf" style="background:${cols[i%2]};--x:${(Math.cos(a)*r).toFixed(0)}px;--y:${(Math.sin(a)*r).toFixed(0)}px;--r:${(Math.random()*540-270).toFixed(0)}deg"></i>`}
  const badge=`<div class="badge"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" transform="rotate(-90 60 60)"/><path d="M38 62l15 15 30-32"/></svg>${conf}</div>`;
  let body="";
  if(M.mode==="session"){voice(["fin_seance"],"Bravo ! Séance terminée.");const s=SES[PLAN[k]];st.checks[k]=s.items.map((_,i)=>i);
    body=`<h2>Bravo !</h2><p class="muted" style="margin:0">${mmss(PL.tot)} de séance · ${PL.works} séries et efforts</p>
    ${PLAN[k]==="T"?`<div class="tins"><b>Tes résultats</b>${testInputs(k,TESTS.map(t=>t.id))}</div>`:""}
    ${!st.done[k]?`<div class="finish"><div class="rpe-row"><label for="rpe" style="font-weight:600">Difficulté ressentie</label><span class="rpe-v">8/10</span></div><input type="range" id="rpe" min="1" max="10" value="8"><textarea id="note" placeholder="Note (sensations, douleur…)"></textarea><button class="btn" data-finish="${k}" data-pl="1">Valider la séance</button></div>`:`<button class="btn" id="pl-back" style="width:100%;max-width:420px">Fermer</button>`}`;}
  else if(M.mode==="test"){voice(["fin_test"],"Test terminé.");body=`<h2>Test terminé</h2><div class="tins">${testInputs(k,[M.test])}</div><button class="btn" id="pl-back" style="width:100%;max-width:420px">Enregistrer</button>`;}
  else{voice(["fin_exo"],"Exercice terminé.");if(k&&M.i!=null&&M.i!==""){const a=st.checks[k]||(st.checks[k]=[]);if(!a.includes(+M.i))a.push(+M.i)}
    body=`<h2>Exercice terminé</h2><p class="muted" style="margin:0">${esc(M.title)} · ${mmss(PL.tot)}</p><button class="btn" id="pl-back" style="width:100%;max-width:420px">Retour à la séance</button>`;}
  save();
  $("#pl-body").innerHTML=`<div class="pl-end">${badge}${body}</div>`;
}
document.addEventListener("visibilitychange",()=>{if(!PL.on)return;if(document.hidden)plPause(true);else wake(true)});

/* ============ Navigation & événements ============ */
function render(){({today:renderToday,plan:renderPlan,prog:renderProg,lib:renderLib})[tab]()}
function setTab(t){tab=t;document.querySelectorAll(".tab").forEach(s=>s.hidden=s.id!=="tab-"+t);document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));render();window.scrollTo(0,0)}
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-close]");if(!b)return;const ds=b.dataset;
  if(ds.close!==undefined){closeEx();return}
  if(ds.play){openPlayer(ds.play);return}
  if(b.id==="pl-start"){plStart();return}
  if(b.id==="pl-done"){plFinishOpen();return}
  if(b.id==="pl-pp"){plPause(!PL.paused);return}
  if(b.id==="pl-prev"){plJump(-1);return}
  if(b.id==="pl-next"){plJump(1);return}
  if(b.id==="pl-x"){if(PL.on){plPause(true);$("#pl-conf").hidden=false}else plClose();return}
  if(b.id==="pl-stay"){$("#pl-conf").hidden=true;plPause(false);return}
  if(b.id==="pl-quit"||b.id==="pl-back"){plClose();return}
  if(b.id==="pl-voice"){plVoice=!plVoice;b.setAttribute("aria-pressed",plVoice);try{localStorage.setItem("prepaSlalom.voice",plVoice?"1":"0")}catch(e){}if(!plVoice)vxStop();return}
  if(ds.tab){setTab(ds.tab);return}
  if(ds.run){const c=SHEET;closeEx();openItem(c.id,c.rx,c.ctx);return}
  if(ds.ex){openEx(ds.ex,ds.rx,{k:ds.k,i:ds.i,test:ds.test});return}
  if(ds.day){view=D(ds.day);renderToday();return}
  if(ds.go){view=D(ds.go);setTab("today");return}
  if(ds.chk!==undefined){const k=ds.k,i=+ds.chk,a=st.checks[k]||(st.checks[k]=[]);const j=a.indexOf(i);j>=0?a.splice(j,1):a.push(i);save();renderToday();return}
  if(ds.finish){const k=ds.finish,f=b.closest(".finish");st.done[k]={rpe:+f.querySelector("input[type=range]").value,note:f.querySelector("textarea").value.trim(),at:TK};st.checks[k]=SES[PLAN[k]].items.map((_,i)=>i);save();if(ds.pl)plClose();else renderToday();return}
  if(ds.undo){delete st.done[ds.undo];save();renderToday();return}
  if(ds.cat){libCat=ds.cat;renderLib();return}
  if(b.id==="pp"){paused=!paused;b.textContent=paused?"Lecture":"Pause";b.setAttribute("aria-pressed",paused);return}
  if(b.id==="sl"){speed=speed===1?.4:1;b.setAttribute("aria-pressed",speed!==1);return}
  if(b.id==="bk-copy"){const txt=JSON.stringify(st);const m=$("#bk-msg");
    if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>m.textContent="Copié. Colle-le dans tes notes.",()=>{showBk(txt);m.textContent="Sélectionne et copie le texte ci-dessus."});else{showBk(txt);m.textContent="Sélectionne et copie le texte ci-dessus."}return}
  if(b.id==="bk-show"){showBk("");return}
  if(b.id==="bk-load"){const m=$("#bk-msg");try{const s=JSON.parse($("#bk-txt").value);if(!s||!s.done)throw 0;st=Object.assign({done:{},checks:{},tests:{}},s);save();renderProg();$("#bk-msg").textContent="Données restaurées."}catch(err){m.textContent="Ce texte n’est pas une sauvegarde valide. Colle exactement le texte copié."}return}
});
function showBk(txt){const a=$("#bk-area");a.hidden=false;const t=$("#bk-txt");t.value=txt;if(txt)t.select()}
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="rpe"){const v=el.closest(".finish").querySelector(".rpe-v");if(v)v.textContent=el.value+"/10";}
  if(el.dataset.test){const k=el.dataset.k;(st.tests[k]||(st.tests[k]={}))[el.dataset.test]=el.value;save();
    const s=SES.T,chk=(st.checks[k]||[]).length,got=TESTS.filter(t=>st.tests[k][t.id]!=null&&st.tests[k][t.id]!=="").length;
    const p=document.querySelector("#tab-today .prog div");if(p)p.style.width=((chk+got)/(s.items.length+TESTS.length)*100)+"%";}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeEx();if(PL.on&&e.key===" "){e.preventDefault();plPause(!PL.paused)}});
render();
</script>
